name: Docker & Ngrok Tunnel

# 1. Se déclenche à chaque push
on: [push]

jobs:
  deploy-tunnel:
    runs-on: ubuntu-latest

    steps:
   
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t flask-app .

      - name: Run Docker Container
        run: docker run -d -p 5000:5000 --name my-running-app flask-app

      - name: Install Ngrok
        run: |
          curl -sSL https://ngrok-agent.s3.amazonaws.com/ngrok.asc \
            | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null \
            && echo "deb https://ngrok-agent.s3.amazonaws.com bookworm main" \
            | sudo tee /etc/apt/sources.list.d/ngrok.list \
            && sudo apt update \
            && sudo apt install ngrok

      - name: Open Ngrok Tunnel and Expose App
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          # Configuration du jeton d'authentification
          ngrok config add-authtoken $NGROK_AUTHTOKEN
          
          # Lancement de Ngrok en arrière-plan vers le port 5000
          ngrok http 5000 > /dev/null &
          
          # Pause de 5 secondes pour laisser le temps au tunnel de s'établir
          sleep 5 
          
          # Récupération de l'URL publique via l'API locale de Ngrok (fournie nativement sur le port 4040)
          PUBLIC_URL=$(curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url')
          
          # Affichage très visible de l'URL dans les logs de GitHub Actions
          echo "=========================================================="
          echo " L'APPLICATION FLASK EST ACCESSIBLE PUBLIQUEMENT ICI :"
          echo " $PUBLIC_URL"
          echo "=========================================================="
          
          # Maintien du tunnel ouvert pendant 120 secondes
          echo "Le tunnel reste actif pendant 120 secondes..."
          sleep 120
          echo "Temps écoulé. Début de la fermeture propre."

      - name: Clean up resources
        if: always()
        run: |
          echo "Arrêt du conteneur Docker et fermeture de Ngrok..."
          docker stop my-running-app || true
          pkill ngrok || true