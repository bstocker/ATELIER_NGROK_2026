name: Build, test and expose Flask with Ngrok

on:
  push:
    branches:
      - main
      - exo-4-registry
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests
        run: pytest

  security:
    needs: quality
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: atelier-devops-flask
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Scan repository for secrets
        run: |
          matches=$(grep -RInE \
            --include='*.py' \
            --include='*.yml' \
            --include='*.yaml' \
            --include='*.toml' \
            --include='*.txt' \
            --include='Dockerfile' \
            --exclude-dir=.git \
            --exclude-dir=.venv \
            --exclude-dir=__pycache__ \
            '(authtoken|api[_-]?key|password|secret)[[:space:]]*[:=][[:space:]]*[^[:space:]]+' . | grep -v 'secrets\.' || true)
          if [ -n "$matches" ]; then
            printf '%s\n' "$matches"
            exit 1
          fi

      - name: Build Docker image
        run: docker build -t "$IMAGE_NAME" .

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.71.0

      - name: Scan image with Trivy
        run: trivy image --exit-code 1 --severity CRITICAL --ignore-unfixed "$IMAGE_NAME"

  build-push:
    needs: security
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/nicolasbellina/atelier_devops_2026
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=pr,prefix=pr-

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  ngrok:
    needs: build-push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IMAGE_NAME: ghcr.io/nicolasbellina/atelier_devops_2026
      APP_PORT: "5000"
      TUNNEL_DURATION: "120"
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select image tag
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "IMAGE_TAG=pr-${{ github.event.number }}" >> "$GITHUB_ENV"
          else
            echo "IMAGE_TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Pull image from GHCR
        run: docker pull "$IMAGE_NAME:$IMAGE_TAG"

      - name: Run Flask container
        run: docker run -d --rm --name flask-app -p "$APP_PORT:$APP_PORT" "$IMAGE_NAME:$IMAGE_TAG"

      - name: Wait for Flask to be ready
        run: |
          for _ in $(seq 1 30); do
            if curl --fail --silent "http://127.0.0.1:$APP_PORT/" > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs flask-app
          exit 1

      - name: Run Ngrok tunnel
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          docker run -d --rm --name ngrok --network host \
            -e NGROK_AUTHTOKEN="$NGROK_AUTHTOKEN" \
            ngrok/ngrok:latest http "$APP_PORT" --log=stdout

      - name: Print public Ngrok URL
        run: |
          url=""
          for _ in $(seq 1 60); do
            url=$(curl --silent http://127.0.0.1:4040/api/tunnels | jq -r '.tunnels[]?.public_url | select(startswith("https://"))' | head -n 1)
            if [ -n "$url" ]; then
              echo "URL publique Ngrok: $url"
              {
                echo "## Tunnel Ngrok"
                echo "$url"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 2
          done
          docker logs ngrok
          exit 1

      - name: Keep tunnel open for 120 seconds
        run: sleep "$TUNNEL_DURATION"

      - name: Stop containers
        if: always()
        run: |
          docker stop ngrok || true
          docker stop flask-app || true