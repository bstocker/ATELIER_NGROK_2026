name: Conteneurisation Ngrok

on: push

permissions:
  contents: read
  packages: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clear Docker auth
        run: |
          unset DOCKER_AUTH_CONFIG
          rm -f ~/.docker/config.json || true
          mkdir -p ~/.docker

      - name: Compute normalized names
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          ACTOR=$(echo "${{ github.actor }}" | tr '[:upper:]' '[:lower:]')
          SERVICE_NAME="flask-render-iac-${ACTOR}"
          IMAGE_URL="ghcr.io/${OWNER}/flask-render-iac"
          IMAGE_TAG="${{ github.sha }}"

          echo "OWNER=${OWNER}" >> "$GITHUB_ENV"
          echo "ACTOR=${ACTOR}" >> "$GITHUB_ENV"
          echo "SERVICE_NAME=${SERVICE_NAME}" >> "$GITHUB_ENV"
          echo "IMAGE_URL=${IMAGE_URL}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"

          echo "Using owner: ${OWNER}"
          echo "Using actor: ${ACTOR}"
          echo "Using service name: ${SERVICE_NAME}"
          echo "Using image: ${IMAGE_URL}:${IMAGE_TAG}"

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker image
        run: |
          docker build -t "${IMAGE_URL}:${IMAGE_TAG}" .
          docker push "${IMAGE_URL}:${IMAGE_TAG}"

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run Docker container
        run: |
          docker run -d \
            --name flask-app \
            -p 5000:5000 \
            "${IMAGE_URL}:${IMAGE_TAG}"
          sleep 2
          docker logs flask-app

      - name: Install and configure Ngrok
        run: |
          curl -s https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz | tar xz -C /tmp
          /tmp/ngrok config add-authtoken "${{ secrets.NGROK_AUTHTOKEN }}"

      - name: Create Ngrok tunnel and Verify deployment
        run: |
          # 1. Lancement de Ngrok en arrière-plan
          /tmp/ngrok http 5000 > /tmp/ngrok.log 2>&1 &
          sleep 5

          # 2. Récupération de l'URL
          NGROK_URL=$(curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url')
          echo "Ngrok URL: ${NGROK_URL}"

          if [ "$NGROK_URL" = "null" ] || [ -z "$NGROK_URL" ]; then
            echo "Erreur : Impossible de générer l'URL Ngrok. Logs :"
            cat /tmp/ngrok.log
            exit 1
          fi

          # 3. Vérification (le tunnel est toujours actif car on est dans le même step)
          echo "Testing Flask app..."
          curl -v "${NGROK_URL}/" || echo "Service not immediately available"
          sleep 2
          curl -v "${NGROK_URL}/exercices/" || echo "Exercices endpoint not available"