name: Conteneurisation Ngrok

on: push

permissions:
  contents: read
  packages: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clear Docker auth
        run: |
          unset DOCKER_AUTH_CONFIG
          rm -f ~/.docker/config.json || true
          mkdir -p ~/.docker

      - name: Compute normalized names
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          ACTOR=$(echo "${{ github.actor }}" | tr '[:upper:]' '[:lower:]')
          SERVICE_NAME="flask-render-iac-${ACTOR}"
          IMAGE_URL="ghcr.io/${OWNER}/flask-render-iac"
          IMAGE_TAG="${{ github.sha }}"

          echo "OWNER=${OWNER}" >> "$GITHUB_ENV"
          echo "ACTOR=${ACTOR}" >> "$GITHUB_ENV"
          echo "SERVICE_NAME=${SERVICE_NAME}" >> "$GITHUB_ENV"
          echo "IMAGE_URL=${IMAGE_URL}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"

          echo "Using owner: ${OWNER}"
          echo "Using actor: ${ACTOR}"
          echo "Using service name: ${SERVICE_NAME}"
          echo "Using image: ${IMAGE_URL}:${IMAGE_TAG}"

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker image
        run: |
          docker build -t "${IMAGE_URL}:${IMAGE_TAG}" .
          docker push "${IMAGE_URL}:${IMAGE_TAG}"

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run Docker container
        run: |
          docker run -d \
            --name flask-app \
            -p 5000:5000 \
            "${IMAGE_URL}:${IMAGE_TAG}"
          sleep 2
          docker logs flask-app

      - name: Install and configure Ngrok
        run: |
          curl -s https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz | tar xz -C /tmp
          # On force l'écriture dans un fichier de config local bien défini
          /tmp/ngrok config add-authtoken "${{ secrets.NGROK_AUTHTOKEN }}" --config /tmp/ngrok.yml

      - name: Create Ngrok tunnel and Verify deployment
        run: |
          echo "Démarrage de Ngrok..."
          # On spécifie le fichier de config et on désactive les updates automatiques
          /tmp/ngrok http 5000 --config /tmp/ngrok.yml --log=stdout > /tmp/ngrok.log 2>&1 &

          # On laisse un peu plus de temps à Ngrok pour initialiser la connexion TLS
          sleep 7
                
          # Affichage des logs Ngrok pour le debug en direct dans la console GitHub
          echo "=== LOGS NGROK ==="
          cat /tmp/ngrok.log
          echo "=================="
                
          # Récupération de l'URL
          NGROK_URL=$(curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url')
          echo "Ngrok URL générée: ${NGROK_URL}"
                
          if [ "$NGROK_URL" = "null" ] || [ -z "$NGROK_URL" ]; then
          echo "Erreur critique : L'URL Ngrok n'a pas pu être récupérée."
          exit 1
          fi

          # Vérification des endpoints
          echo "Testing Flask app via Ngrok..."
          curl -v "${NGROK_URL}/" || echo "Le point d'entrée principal n'est pas disponible"
          sleep 2
          curl -v "${NGROK_URL}/exercices/" || echo "L'endpoint /exercices/ n'est pas disponible"
